<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>TechLens</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="top">
      <img class="logo" src="icons/logo.svg" alt="" width="32" height="32" />
      <div class="brand">
        <h1>TechLens</h1>
        <strong id="host">Trang hiện tại</strong>
      </div>
      <button id="open-panel" class="ghost" title="Giữ kết quả khi chuyển tab">Side panel</button>
      <button id="scan" class="primary" title="Quét lại trang này">Quét lại</button>
    </header>

    <div id="status" class="status" role="status" aria-live="polite">
      Đang đọc dấu vết công nghệ…
    </div>

    <section class="stats" aria-label="Tóm tắt">
      <div class="stat"><span id="stat-total">0</span><small>Công nghệ</small></div>
      <div class="stat"><span id="stat-versions">0</span><small>Có phiên bản</small></div>
      <div class="stat"><span id="stat-cve">–</span><small>CVE khớp</small></div>
    </section>

    <nav class="tabs" role="tablist">
      <button id="tab-tech" role="tab" class="active">Công nghệ</button>
      <button id="tab-cve" role="tab">CVE</button>
      <button id="tab-history" role="tab">Lịch sử</button>
    </nav>

    <section id="view-tech" class="view">
      <div class="toolbar">
        <input
          id="search"
          type="search"
          aria-label="Tìm công nghệ"
          placeholder="Tìm công nghệ hoặc nhóm…"
        />
        <button id="export" class="ghost" disabled>Xuất JSON</button>
      </div>
      <label class="toggle">
        <input id="deep-scan" type="checkbox" /><span></span>
        <div>
          <b>Quét sâu bundle</b>
          <small>Tải lại file JS và source map để tìm phiên bản thư viện bị đóng gói.</small>
        </div>
      </label>
      <p id="count" class="count">0 công nghệ</p>
      <main id="results"></main>
    </section>

    <section id="view-cve" class="view" hidden>
      <div class="hunt-actions">
        <button id="hunt" class="primary" disabled>Tra CVE</button>
        <button id="fresh" class="ghost" disabled title="Bỏ cache và tra cứu lại">Tra mới</button>
      </div>
      <label class="toggle">
        <input id="auto-hunt" type="checkbox" /><span></span>
        <div>
          <b>Tự tra CVE khi quét</b>
          <small>OSV nhận tên package + phiên bản; NVD nhận tên CPE. Không gửi URL website.</small>
        </div>
      </label>
      <div id="hunt-status" class="hunt-status" role="status" aria-live="polite">Chưa tra CVE.</div>
      <div id="hunt-results"></div>
    </section>

    <section id="view-history" class="view" hidden>
      <label class="toggle">
        <input id="save-history" type="checkbox" /><span></span>
        <div>
          <b>Lưu lịch sử trên máy này</b>
          <small
            >50 lần quét gần nhất: tên miền, công nghệ, phiên bản. Không lưu URL chi tiết.</small
          >
        </div>
      </label>
      <div class="history-head">
        <span id="history-summary">Lịch sử quét (0)</span>
        <button id="clear-history" class="ghost">Xóa lịch sử</button>
      </div>
      <ul id="history-list"></ul>
    </section>

    <footer>
      <button id="headers" class="link">Cấp quyền site (headers + quét từ side panel)</button>
      <p id="notice">Quét công nghệ cục bộ · CVE Hunt dùng OSV/NVD khi bật</p>
    </footer>
    <script type="module" src="popup.js"></script>
  </body>
</html>
